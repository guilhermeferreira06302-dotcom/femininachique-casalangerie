<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Feminina Chique &amp; Casa do Langerie</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#b5106a",
                        "primary-container": "#ffd9e4",
                        "on-primary-container": "#3e0020",
                        "on-primary": "#ffffff",
                        "surface": "#f7f9ff",
                        "on-surface": "#181c20",
                        "surface-container": "#ebeef3",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#dfbec8",
                        "secondary": "#635c61",
                        "secondary-container": "#e7dde2",
                        "on-secondary-container": "#1f1a1e",
                        "on-surface-variant": "#584048"
                    },
                    fontFamily: {
                        "body": ["Hanken Grotesk", "sans-serif"],
                        "headline": ["Bodoni Moda", "serif"],
                    },
                    spacing: {
                        "section": "6rem",
                    }
                }
            }
        }
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splitTextToLetters = (element) => {
                const childNodes = Array.from(element.childNodes);
                element.innerHTML = '';
                childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        const text = child.textContent;
                        for (let i = 0; i < text.length; i++) {
                            const char = text[i];
                            if (char.trim() === '') {
                                element.appendChild(document.createTextNode(char));
                            } else {
                                const span = document.createElement('span');
                                span.className = 'letter';
                                span.textContent = char;
                                element.appendChild(span);
                            }
                        }
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        splitTextToLetters(child);
                        element.appendChild(child);
                    }
                });
            };

            const baseH1 = document.getElementById('h1-base');
            const shineH1 = document.getElementById('h1-shine');
            
            if (baseH1 && shineH1) {
                splitTextToLetters(baseH1);
                splitTextToLetters(shineH1);
                
                const baseLetters = baseH1.querySelectorAll('.letter');
                const shineLetters = shineH1.querySelectorAll('.letter');
                const containerWidth = baseH1.parentElement.offsetWidth || 1;
                
                baseLetters.forEach((letter, i) => {
                    const L = letter.offsetLeft / containerWidth;
                    const jumpDelay = (i * 0.05);
                    const swingDelay = (1.5 * L) + 2.25;
                    
                    letter.style.animationDelay = `${jumpDelay}s, ${swingDelay}s`;
                    if(shineLetters[i]) {
                        shineLetters[i].style.animationDelay = `${jumpDelay}s, ${swingDelay}s`;
                    }
                });
            }
        });
    </script>
    <style>
        .shine-overlay {
            color: rgba(255,255,255,0.9) !important;
            -webkit-text-fill-color: rgba(255,255,255,0.9) !important;
            -webkit-mask-image: linear-gradient(65deg, rgba(0,0,0,0) 45%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 55%);
            -webkit-mask-size: 300% 100%;
            -webkit-mask-repeat: no-repeat;
            animation: shine-sweep 6s ease-in-out infinite !important;
        }
        .shine-overlay span {
            color: rgba(255,255,255,0.9) !important;
            -webkit-text-fill-color: rgba(255,255,255,0.9) !important;
        }
        @keyframes shine-sweep {
            0% { -webkit-mask-position: 150% 0; mask-position: 150% 0; }
            100% { -webkit-mask-position: -50% 0; mask-position: -50% 0; }
        }
        @keyframes letter-swing {
            0% { transform: translateX(0) skewX(0); }
            5% { transform: translateX(12px) skewX(-10deg); }
            10% { transform: translateX(-6px) skewX(5deg); }
            15% { transform: translateX(3px) skewX(-2deg); }
            20%, 100% { transform: translateX(0) skewX(0); }
        }
        @keyframes elastic-up {
            0% { translate: 0 150px; opacity: 0; }
            100% { translate: 0 0; opacity: 1; }
        }
        .letter {
            display: inline-block;
            opacity: 0;
            animation: elastic-up 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, letter-swing 6s ease-in-out infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen antialiased flex flex-col">

        </div>
        
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full flex flex-col items-center justify-center">
            <div class="w-full max-w-2xl mx-auto text-center">
                <div class="relative w-full flex justify-center mb-6 z-10">
                    <h1 id="h1-base" class="font-headline text-[11vw] sm:text-7xl lg:text-8xl font-medium text-black leading-tight flex flex-col items-center">
                        <span class="whitespace-nowrap">Feminina <span class="text-primary italic font-semibold">Chique</span></span>
                        <span class="text-[6vw] sm:text-4xl text-black font-medium -my-1">&amp;</span>

                    </h1>
                    <h1 id="h1-shine" class="absolute top-0 font-headline text-[11vw] sm:text-7xl lg:text-8xl font-medium leading-tight flex flex-col items-center pointer-events-none select-none shine-overlay z-50" aria-hidden="true">
                        <span class="whitespace-nowrap">Feminina <span class="italic text-transparent font-semibold">Chique</span></span>
                        <span class="text-[6vw] sm:text-4xl font-medium -my-1 text-transparent">&amp;</span>
                        <span class="whitespace-nowrap"><span class="font-semibold text-transparent italic">Casa do</span> Langerie</span>
                    </h1>
                </div>
                <div class="flex flex-col items-center gap-5 animate-fade-in-up delay-300 mt-8 relative z-20 w-full">
                    <!-- Névoa para esconder as letras -->
                    <div class="absolute -top-8 left-1/2 -translate-x-1/2 w-[110%] max-w-5xl h-[300px] bg-gradient-to-t from-surface via-surface via-70% to-transparent opacity-100 -z-10 pointer-events-none" style="-webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);"></div>
                    
                    <div class="flex flex-col w-full items-center gap-2">
                        <span class="text-sm font-bold text-on-surface/70 tracking-widest uppercase w-[90vw] sm:w-[450px] text-center">Localização</span>
                        <a href="https://maps.app.goo.gl/r2kRdH3XYBSe3kuv5" target="_blank" rel="noopener noreferrer" class="relative isolate overflow-hidden w-[90vw] sm:w-[450px] aspect-[3/1] flex justify-center items-center gap-2 text-on-primary rounded-3xl text-lg font-bold tracking-wide transition-all shadow-xl shadow-primary/20 hover:-translate-y-1 group">
                            <!-- Background Image -->
                            <img src="/mapa.png?v=3" alt="Mapa" class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-110" />
                            
                            <!-- Pink Overlay at 50% Opacity -->
                            <div class="absolute inset-0 z-0 bg-primary/50 group-hover:bg-primary/60 transition-colors duration-300"></div>
                            
                            <!-- Content -->
                            <div class="relative z-10 flex items-center gap-2 text-on-primary drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                                Ver no Mapa
                                <span class="material-symbols-outlined text-base">location_on</span>
                            </div>
                        </a>
                    </div>
                    
                    <div class="flex flex-col w-full items-center gap-2 mt-2">
                        <span class="text-sm font-bold text-on-surface/70 tracking-widest uppercase w-[90vw] sm:w-[450px] text-center">Whatsapp:</span>
                        <a href="https://wa.me/5521984893537?text=Oii%2C%20vim%20do%20instagram" target="_blank" rel="noopener noreferrer" class="relative isolate overflow-hidden w-[90vw] sm:w-[450px] aspect-[3/1] flex justify-center items-center gap-2 text-on-primary rounded-3xl text-lg font-bold tracking-wide transition-all shadow-xl shadow-primary/20 hover:-translate-y-1 group">
                            <!-- Background Image -->
                            <img src="/perfil_casa_do_langerie.png" alt="Perfil Casa do Langerie" class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-105" />

                        </a>
                    </div>

                    <div class="flex flex-col w-full items-center gap-2 mt-2">
                        <a href="https://wa.me/5521983476437?text=Oii%2C%20vim%20pelo%20instagram" target="_blank" rel="noopener noreferrer" class="relative isolate overflow-hidden w-[90vw] sm:w-[450px] aspect-[3/1] flex justify-center items-center gap-2 text-on-primary rounded-3xl text-lg font-bold tracking-wide transition-all shadow-xl shadow-primary/20 hover:-translate-y-1 group">
                            <!-- Background Image -->
                            <img src="/feminina_chique_perfil.png" alt="Perfil Feminina Chique" class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-700 group-hover:scale-105" />

                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>







</body>
</html>
